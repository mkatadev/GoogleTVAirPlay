# Release: push a tag `vX.Y.Z` → signed release APK attached to a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 -i release.keystore
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias (e.g. tvairplay)
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (X.Y.Z); builds a signed APK artifact without publishing a release
        required: true
      version_code:
        description: Optional version code override (use when rebuilding an existing release)
        required: false
      use_tag_source:
        description: Build from the matching vX.Y.Z tag instead of the selected ref
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.use_tag_source && format('refs/tags/v{0}', inputs.version) || github.ref }}
          submodules: recursive

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must be X.Y.Z, got '$version'"; exit 1
          fi
          if [[ -n "$INPUT_VERSION_CODE" ]]; then
            if ! [[ "$INPUT_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Version code must be a positive integer, got '$INPUT_VERSION_CODE'"; exit 1
            fi
            code="$INPUT_VERSION_CODE"
          else
            published_count="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -s 'add | map(select(.draft == false and .prerelease == false)) | length')"
            code=$((published_count + 1))
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $version (versionCode $code)"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then echo "::error::Missing secret $v — refusing to publish a debug-signed release"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK & CMake
        run: yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache native build
        uses: actions/cache@v6
        with:
          path: airplay-core/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('airplay-core/src/main/cpp/**', '.gitmodules', 'airplay-core/build.gradle.kts') }}
          restore-keys: cxx-${{ runner.os }}-

      - run: tools/third-party.sh verify-patches

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature & package artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          apk="dist/AirPlay-for-Google-TV-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          # complete corresponding source (GPL-3.0): GitHub's auto "Source code" archives omit the submodules
          src="AirPlay-for-Google-TV-v$VERSION-full-source"
          git ls-files --recurse-submodules -z | tar --null -T - -czf "dist/$src.tar.gz" --transform "s|^|$src/|"
          cp airplay-core/src/main/cpp/third_party/VERSIONS.md dist/THIRD-PARTY-VERSIONS.md
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -la dist && cat dist/*.sha256

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AirPlay-for-Google-TV-v${{ steps.version.outputs.name }}
          path: dist/*

      # release notes = this version's CHANGELOG.md section, followed by the install blurb
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { p = ($0 ~ "^## \\[" v "\\]") }
            p && !/^## \[/ { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then echo "No CHANGELOG.md section for $VERSION" >&2; exit 1; fi
          cat >> dist/RELEASE_NOTES.md <<EOF

          ---
          **Install:** on macOS/Linux run \`curl -fsSL https://raw.githubusercontent.com/mkatadev/GoogleTVAirPlay/main/install.sh | bash\`,
          or download the APK and sideload it (\`adb install -r AirPlay-for-Google-TV-v$VERSION.apk\` or any TV file manager).
          Already installed? Settings → About → App update installs it from the TV. Verify with the \`.sha256\` file. Requires Android TV 12+.

          \`*-full-source.tar.gz\` is the complete source including the third-party submodules (UxPlay, libplist,
          FFmpeg, openssl-cmake) at the exact pinned commits listed in \`THIRD-PARTY-VERSIONS.md\` — GitHub's
          auto-generated "Source code" archives below do not include them.
          EOF
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/*.sha256
            dist/*.tar.gz
