name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  third-party:
    name: Third-party patches & versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: tools/third-party.sh verify-patches
      - name: VERSIONS.md is up to date
        run: |
          tools/third-party.sh versions
          git diff --exit-code -- airplay-core/src/main/cpp/third_party/VERSIONS.md \
            || { echo "::error::third_party/VERSIONS.md is stale — run tools/third-party.sh versions and commit"; exit 1; }

  build:
    name: Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK; the NDK/CMake versions pinned in airplay-core/build.gradle.kts are added here
      - name: Install NDK & CMake
        run: yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null

      - uses: gradle/actions/setup-gradle@v6

      # OpenSSL + FFmpeg are compiled from source for 3 ABIs (~10 min); keep the native build dir between runs
      - name: Cache native build
        uses: actions/cache@v6
        with:
          path: airplay-core/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('airplay-core/src/main/cpp/**', '.gitmodules', 'airplay-core/build.gradle.kts') }}
          restore-keys: cxx-${{ runner.os }}-

      # build-only check; nothing is published from CI — releases come from release.yml on a v* tag
      - name: Unit tests & debug build
        run: ./gradlew :airplay-core:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests
